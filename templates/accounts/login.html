<!-- templates/accounts/login.html -->
{% extends 'base.html' %}
{% block title %}Kirish - BLOG-SITE{% endblock %}

{% block content %}
<div class="container" style="max-width: 450px;">
    <div class="custom-card p-4 p-md-5 mt-4">
        <h3 class="fw-bold text-center mb-4">Tizimga kirish</h3>
        <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div class="alert alert-danger py-2 small">{{ form.non_field_errors }}</div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Foydalanuvchi nomi</label>
                {{ form.username }}
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Parol</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 py-2">Kirish</button>
        </form>
        <p class="text-center text-muted small mt-4 mb-0">
            Akkountingiz yo'qmi? <a href="{% url 'accounts:register' %}" class="fw-bold">Ro'yxatdan o'tish</a>
        </p>
    </div>
</div>
{% endblock %}
