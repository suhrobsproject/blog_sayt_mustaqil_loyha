<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>{% if article %}Maqolani tahrirlash{% else %}Yangi maqola yozish{% endif %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 700px;">
        <a href="{% url 'article-list' %}" class="btn btn-secondary mb-3">&larr; Orqaga</a>

        <h2 class="mb-4">{% if article %}Maqolani tahrirlash{% else %}Yangi maqola yozish{% endif %}</h2>

        <form method="post" class="needs-validation">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100">Saqlash</button>
        </form>
    </div>
</body>
</html>
