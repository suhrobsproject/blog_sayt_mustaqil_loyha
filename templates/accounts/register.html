<!-- templates/accounts/register.html -->
{% extends 'base.html' %}
{% block title %}Ro'yxatdan o'tish - BLOG-SITE{% endblock %}

{% block content %}
<div class="container" style="max-width: 500px;">
    <div class="custom-card p-4 p-md-5 mt-3">
        <h3 class="fw-bold text-center mb-4">Ro'yxatdan o'tish</h3>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-2">Akkaunt yaratish</button>
        </form>
        <p class="text-center text-muted small mt-4 mb-0">
            Akkountingiz bormi? <a href="{% url 'accounts:login' %}" class="fw-bold">Kirish</a>
        </p>
    </div>
</div>
{% endblock %}
